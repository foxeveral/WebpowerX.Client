# .github/workflows/publish.yml
name: Publish NuGet Package

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # ⭐ 关键步骤1：为 job 添加 id-token 权限，允许 GitHub 向 NuGet 证明身份
    permissions:
      contents: read
      id-token: write  # 这一行必不可少！

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack NuGet package
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        dotnet pack --configuration Release --no-build --output ./nupkg /p:PackageVersion=$VERSION

    # ⭐ 关键步骤2：发布命令中移除 --api-key，改为指定 NuGet 源
    - name: Push to NuGet.org (Trusted Publisher)
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      # ⚠️ 注意：这里不再需要 --api-key 参数！
